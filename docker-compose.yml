services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
  
  redis:
    image: redis:7-alpine
    container_name: doancnpm_redis
    ports:
      - "6379:6379"
    restart: always


volumes:
  mysqldata: