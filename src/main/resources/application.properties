spring.application.name=doan-cnpm
server.port=8081
# 1. Cấu hình Datasource (kết nối MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/doancnpm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình JPA / Hibernate
# ddl-auto = update: tự động tạo/cập nhật bảng dựa trên các class @Entity (User, Customer,...)
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL và format cho dễ đọc trên terminal khi chạy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chỉ định dialect cho MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

