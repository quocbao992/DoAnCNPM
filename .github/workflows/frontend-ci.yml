name: Frontend Pipeline
on:
  push:
    branches: [ "main", "master", "TienDat" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend  

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' 

      - name: Bước 1 - Install Dependencies
        run: npm install

      - name: Bước 2 - Lint
        run: npm run lint
        continue-on-error: true 

      - name: Bước 3 - Build
        run: npm run build