# ==========================================
  # JOB 1: KIỂM DUYỆT BACKEND (SPRING BOOT)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest
    # Đã xóa phần 'defaults' đi vì pom.xml nằm ngay ngoài cùng

    steps:
      - name: Lấy mã nguồn về máy ảo
        uses: actions/checkout@v3

      - name: Cài đặt môi trường Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Cấp quyền thực thi cho Maven Wrapper
        run: chmod +x ./mvnw

      - name: Bước 1 - Install #(Tải thư viện)
        run: mvn dependency:resolve

      - name: Bước 2 - Lint #(Kiểm tra định dạng code)
        run: mvn checkstyle:check

      - name: Bước 3 - Unit Test #(Chạy kiểm thử)
        run: mvn test

      - name: Bước 4 - Build #(Đóng gói ứng dụng)
        run: mvn clean package -DskipTests